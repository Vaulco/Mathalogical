[package]
name = "mathalogical"
version = "0.0.0"
description = "Just a app for notes"
authors = ["Danyil"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["image-ico", "devtools"] }
tauri-plugin-window-state = { version = "2" }
tauri-plugin-store = "2"
tauri-plugin-single-instance = { version = "2" }
tokio = { version = "1.45.0", features = ["time"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
lofty = "0.22.4"
base64 = "0.22.1"
rayon = "1.10.0"
dirs = "5.0"
tauri-plugin-dialog = "2.3.3"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
